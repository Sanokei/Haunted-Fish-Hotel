<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1680" height="1010" viewBox="0 0 1680 1010"><rect width="1680" height="1010" fill="#152329"/><style>text{font-family:DejaVu Sans,sans-serif}</style><text x="44" y="47" font-size="14" fill="#89dfc8" font-weight="bold">HAUNTED FISH HOTEL · ORIGINAL UPLOADED ART</text><text x="44" y="95" font-size="35" fill="#f4eddd" font-weight="bold">Tablecart, angler and suspended chandelier</text><text x="44" y="128" font-size="17" fill="#cedcd7">Authored prefab layout and source-art review · 13 October 2026</text><rect x="1152" y="37" width="484" height="100" fill="#24363d" stroke="#c3a76d" rx="6"/><text x="1172" y="66" font-size="17" fill="#ffe4a3" font-weight="bold">ARTWORK LAYOUT PREVIEW</text><text x="1172" y="91" font-size="15" fill="#ffe4a3">Not a Unity capture. Native import, animation,</text><text x="1172" y="114" font-size="15" fill="#ffe4a3">physics and multiplayer validation are still pending.</text><rect x="44" y="162" width="516" height="679" fill="#24363d" stroke="#52686c" rx="12"/><text x="66" y="199" font-size="26" fill="#f4eddd" font-weight="bold">Tablecart</text><text x="66" y="228" font-size="17" fill="#cedcd7">Existing cart identity, new silhouette</text><rect x="45" y="250" width="514" height="411" fill="#a1aaa7" stroke="none" rx="0"/><rect x="582" y="162" width="516" height="679" fill="#24363d" stroke="#52686c" rx="12"/><text x="604" y="199" font-size="26" fill="#f4eddd" font-weight="bold">Angler fish</text><text x="604" y="228" font-size="17" fill="#cedcd7">Authored possession light and glow</text><rect x="583" y="250" width="514" height="411" fill="#a1aaa7" stroke="none" rx="0"/><rect x="1120" y="162" width="516" height="679" fill="#24363d" stroke="#52686c" rx="12"/><text x="1142" y="199" font-size="26" fill="#f4eddd" font-weight="bold">Chandelier</text><text x="1142" y="228" font-size="17" fill="#cedcd7">Fixed canopy; suspended cord and body</text><rect x="1121" y="250" width="514" height="411" fill="#a1aaa7" stroke="none" rx="0"/><svg x="44" y="250" width="516" height="411" viewBox="101 560 1859 1452"><image xlink:href="../../Assets/Art/Traps/TRAP-Hotel-cart.png" width="2048" height="2048"/></svg><svg x="582" y="250" width="258" height="411" viewBox="-100 100 2300 2000"><image xlink:href="../../Assets/Art/Traps/TRAP-Angler-fish.png" width="2048" height="2048"/></svg><svg x="840" y="250" width="258" height="411" viewBox="-100 100 2300 2000"><image xlink:href="../../Assets/Art/Traps/TRAP-Angler-fish-glow.png" width="2048" height="2048"/></svg><rect x="598" y="266" width="153" height="29" fill="#29423b" stroke="none" rx="4"/><text x="608" y="286" font-size="13" fill="#f4eddd" font-weight="bold">UNPOSSESSED</text><rect x="856" y="266" width="130" height="29" fill="#29423b" stroke="none" rx="4"/><text x="866" y="286" font-size="13" fill="#f4eddd" font-weight="bold">POSSESSED</text><svg x="1120" y="250" width="516" height="411" viewBox="-65 -10 2178 2240"><defs><clipPath id="canopy"><rect width="2048" height="260"/></clipPath><clipPath id="suspended"><rect y="260" width="2048" height="1788"/></clipPath></defs><g clip-path="url(#canopy)"><image xlink:href="../../Assets/Art/Traps/TRAP-Chandelier-v3.png" width="2048" height="2048"/></g><g transform="rotate(3 1024 260)"><g clip-path="url(#suspended)"><image xlink:href="../../Assets/Art/Traps/TRAP-Chandelier-v3.png" width="2048" height="2048"/></g></g><circle cx="1024" cy="260" r="15" fill="#edbe60" stroke="#344f48" stroke-width="5"/><path d="M1060 260 H1580" stroke="#36534c" stroke-width="5"/><text x="1600" y="278" font-size="55" fill="#234339">pivot</text></svg><rect x="56" y="623" width="492" height="27" fill="#29423b" stroke="none" rx="4"/><text x="68" y="642" font-size="14" fill="#f4eddd">Original aspect · 2.5 × 1.646 world units</text><rect x="594" y="623" width="492" height="27" fill="#29423b" stroke="none" rx="4"/><text x="606" y="642" font-size="14" fill="#f4eddd">14 units/s · 25% speed through bodies</text><rect x="1132" y="623" width="492" height="27" fill="#29423b" stroke="none" rx="4"/><text x="1144" y="642" font-size="14" fill="#f4eddd">Shown at +3° · original cord preserved</text><text x="66" y="694" font-size="14" fill="#89dfc8" font-weight="bold">NONLETHAL CONTACT</text><text x="66" y="732" font-size="18" fill="#f4eddd" font-weight="bold">Knockback + one-second stun.</text><text x="66" y="766" font-size="16" fill="#d7e3df">Three authored solid parts cover the cloth,</text><text x="66" y="793" font-size="16" fill="#d7e3df">dome and handle. Source colors are unchanged.</text><text x="604" y="694" font-size="14" fill="#89dfc8" font-weight="bold">LETHAL HORIZONTAL SWEEP</text><text x="604" y="732" font-size="18" fill="#f4eddd" font-weight="bold">Passes through each struck fish.</text><text x="604" y="766" font-size="16" fill="#d7e3df">Normal and possessed images are mutually</text><text x="604" y="793" font-size="16" fill="#d7e3df">exclusive; the lure light follows possession.</text><text x="1142" y="694" font-size="14" fill="#89dfc8" font-weight="bold">PIXEL-PRESERVING SPRITE SPLIT</text><text x="1142" y="732" font-size="18" fill="#f4eddd" font-weight="bold">Ceiling canopy is a separate layout.</text><text x="1142" y="766" font-size="16" fill="#d7e3df">Unity sprite rectangles isolate it from the cord</text><text x="1142" y="793" font-size="16" fill="#d7e3df">and body. The PNG itself is unchanged.</text><path d="M44 875 H1636" stroke="#51676b"/><text x="44" y="910" font-size="17" fill="#f4eddd" font-weight="bold">Asset integrity</text><text x="44" y="937" font-size="15" fill="#c4d1ce">Six PNGs match the upload byte-for-byte. Chandelier v3 is the default;</text><text x="44" y="961" font-size="15" fill="#c4d1ce">v1/v2 are retained. Cart and chandelier keep their original prefab GUIDs.</text><text x="858" y="910" font-size="17" fill="#f4eddd" font-weight="bold">Verification</text><text x="858" y="937" font-size="15" fill="#c4d1ce">Source guards pass for bindings, collider coverage and the live catalog.</text><text x="858" y="961" font-size="15" fill="#ffe2a7">This illustrates authored source layouts, not engine playback.</text></svg>